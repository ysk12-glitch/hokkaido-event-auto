<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>北海道イベントチェック</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #1f4f7a;
    color: white;
    padding: 20px 16px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: 0.9;
}

.container {
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

.month-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.month-control button {
    border: none;
    background: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

#monthTitle {
    font-size: 20px;
    font-weight: bold;
}

.update {
    background: white;
    padding: 11px 13px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #666;
}

.event {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
}

.event:active {
    transform: scale(0.99);
}

.event-date {
    font-weight: bold;
    color: #1f4f7a;
    font-size: 14px;
}

.event-name {
    font-size: 18px;
    font-weight: bold;
    margin: 6px 0;
}

.event-place {
    font-size: 14px;
    color: #555;
}

.badges {
    margin-top: 10px;
}

.badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 7px;
    margin-right: 5px;
    margin-bottom: 4px;
    font-size: 11px;
    background: #eee;
}

.hotel {
    background: #ffe8e8;
    color: #b00020;
}

.traffic {
    background: #fff2d6;
    color: #9a6500;
}

.large {
    background: #eee3ff;
    color: #6335a8;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #777;
}

/* 詳細画面 */
.modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
}

.modal-content {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: calc(100% - 30px);
    max-width: 670px;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    box-sizing: border-box;
    max-height: 80vh;
    overflow-y: auto;
}

.close {
    text-align: right;
    font-size: 28px;
    color: #777;
    cursor: pointer;
}

.modal h2 {
    margin-top: 5px;
    font-size: 21px;
}

.detail-row {
    padding: 9px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.impact {
    margin-top: 15px;
    padding: 13px;
    background: #f5f6f8;
    border-radius: 12px;
}

.impact-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.loading {
    text-align: center;
    padding: 40px 10px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>北海道イベントチェック</h1>
    <p>北海道内のマラソン・祭り・花火・ライブなど、人が集まるイベントをチェック</p>
</header>

<div class="container">

    <div class="month-control">
        <button onclick="changeMonth(-1)">‹</button>
        <div id="monthTitle"></div>
        <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="update" id="updateInfo">
        📡 イベント情報を読み込み中…
    </div>

    <div id="eventList">
        <div class="loading">
            イベント情報を読み込んでいます…
        </div>
    </div>

</div>

<!-- 詳細モーダル -->
<div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">

        <div class="close" onclick="closeModal()">×</div>

        <h2 id="modalName"></h2>

        <div class="detail-row">
            📅 <strong>開催日：</strong>
            <span id="modalDate"></span>
        </div>

        <div class="detail-row">
            📍 <strong>場所：</strong>
            <span id="modalPlace"></span>
        </div>

        <div class="detail-row">
            🏷️ <strong>種類：</strong>
            <span id="modalType"></span>
        </div>

        <div class="detail-row" id="modalDescriptionRow">
            📝 <strong>内容：</strong>
            <span id="modalDescription"></span>
        </div>

        <div class="impact">

            <div class="impact-title">
                🚨 影響予測
            </div>

            <div>
                🏨 ホテル：
                <strong id="modalHotel"></strong>
            </div>

            <div style="margin-top:8px;">
                🚗 交通：
                <strong id="modalTraffic"></strong>
            </div>

            <div style="margin-top:8px;">
                👥 人出：
                <strong id="modalCrowd"></strong>
            </div>

        </div>

    </div>
</div>

<script>

let currentDate = new Date();

let events = [];


/* =========================
   events.jsonを読み込む
========================= */

async function loadEvents() {

    const updateInfo = document.getElementById("updateInfo");

    try {

        const response = await fetch("events.json?ts=" + Date.now());

        if (!response.ok) {
            throw new Error("events.jsonを読み込めませんでした");
        }

        events = await response.json();

        updateInfo.textContent =
            "📡 イベント情報：最新データを読み込みました";

        render();

    } catch (error) {

        console.error(error);

        updateInfo.textContent =
            "⚠️ イベント情報を読み込めませんでした";

        document.getElementById("eventList").innerHTML =
            '<div class="empty">イベント情報の読み込みに失敗しました。<br>しばらくしてから再度お試しください。</div>';
    }
}


/* =========================
   日付表示
========================= */

function formatDate(date) {

    const d = new Date(date + "T00:00:00");

    return `${d.getMonth() + 1}/${d.getDate()}`;
}


/* =========================
   月変更
========================= */

function changeMonth(amount) {

    currentDate.setMonth(currentDate.getMonth() + amount);

    render();
}


/* =========================
   イベント表示
========================= */

function render() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle").textContent =
        `${year}年${month + 1}月`;

    const list = document.getElementById("eventList");

    const monthStart =
        new Date(year, month, 1);

    const monthEnd =
        new Date(year, month + 1, 0);


    const filtered = events
        .filter(event => {

            const start =
                new Date(event.date + "T00:00:00");

            const end =
                new Date(
                    (event.endDate || event.date) +
                    "T00:00:00"
                );

            return start <= monthEnd &&
                   end >= monthStart;

        })
        .sort((a, b) =>
            new Date(a.date) - new Date(b.date)
        );


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">この月のイベント情報はありません。</div>';

        return;
    }


    list.innerHTML = filtered.map((event, index) => {

        let badges = "";

        if (event.hotel === "大") {

            badges +=
                '<span class="badge hotel">🏨 ホテル影響大</span>';

        } else if (event.hotel === "中") {

            badges +=
                '<span class="badge hotel">🏨 ホテル影響中</span>';

        }


        if (event.traffic === "大") {

            badges +=
                '<span class="badge traffic">🚗 交通影響大</span>';

        } else if (event.traffic === "中") {

            badges +=
                '<span class="badge traffic">🚗 交通影響中</span>';

        }


        if (event.crowd === "大") {

            badges +=
                '<span class="badge large">👥 大規模</span>';

        }


        const endDate =
            event.endDate || event.date;


        return `
            <div class="event"
                 onclick="showDetail(${events.indexOf(event)})">

                <div class="event-date">

                    ${formatDate(event.date)}

                    ${
                        endDate !== event.date
                        ? " ～ " + formatDate(endDate)
                        : ""
                    }

                </div>

                <div class="event-name">
                    ${event.name}
                </div>

                <div class="event-place">
                    📍 ${event.place}
                </div>

                <div class="badges">

                    <span class="badge">
                        ${event.type || "イベント"}
                    </span>

                    ${badges}

                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   詳細表示
========================= */

function showDetail(index) {

    const event = events[index];

    if (!event) return;


    document.getElementById("modalName").textContent =
        event.name || "";

    const endDate =
        event.endDate || event.date;

    document.getElementById("modalDate").textContent =
        endDate !== event.date
        ? `${formatDate(event.date)} ～ ${formatDate(endDate)}`
        : formatDate(event.date);

    document.getElementById("modalPlace").textContent =
        event.place || "－";

    document.getElementById("modalType").textContent =
        event.type || "－";

    document.getElementById("modalDescription").textContent =
        event.description || "詳細情報はありません。";

    document.getElementById("modalHotel").textContent =
        event.hotel || "－";

    document.getElementById("modalTraffic").textContent =
        event.traffic || "－";

    document.getElementById("modalCrowd").textContent =
        event.crowd || "－";


    document.getElementById("modal").style.display =
        "block";
}


/* =========================
   詳細を閉じる
========================= */

function closeModal(event) {

    if (
        !event ||
        event.target.id === "modal"
    ) {

        document.getElementById("modal").style.display =
            "none";
    }
}


/* =========================
   開始
========================= */

loadEvents();

</script>

</body>
</html>
