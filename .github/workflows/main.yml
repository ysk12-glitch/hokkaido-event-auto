name: 北海道イベント自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要なライブラリをインストール
        run: |
          pip install requests beautifulsoup4

      - name: 北海道イベント情報を取得
        run: |
          python <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import json
          import re
          from urllib.parse import urljoin, urlparse
          from datetime import datetime

          BASE_URL = "https://www.visit-hokkaido.jp"
          START_URL = "https://www.visit-hokkaido.jp/event/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              )
          }

          session = requests.Session()
          session.headers.update(headers)

          # --------------------------------------------------
          # ページ取得
          # --------------------------------------------------

          def get_soup(url):
              try:
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  return BeautifulSoup(r.text, "html.parser")
              except Exception as e:
                  print("取得失敗:", url, e)
                  return None

          # --------------------------------------------------
          # 日付をYYYY-MM-DDに変換
          # --------------------------------------------------

          def normalize_date(text):
              if not text:
                  return None

              text = text.replace("　", " ")
              text = text.replace("年", "/")
              text = text.replace("月", "/")
              text = text.replace("日", "")
              text = text.replace("（", "(")
              text = text.replace("）", ")")

              # 2026/9/11
              m = re.search(r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})", text)

              if m:
                  y, mo, d = m.groups()
                  return f"{y}-{int(mo):02d}-{int(d):02d}"

              return None

          # --------------------------------------------------
          # 開催期間から開始日・終了日を取得
          # --------------------------------------------------

          def parse_dates(text):
              if not text:
                  return None, None

              text = text.replace("　", " ")

              # 2026/9/4-9/6
              m = re.search(
                  r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})"
                  r"\s*(?:-|～|〜|から)\s*"
                  r"(?:(20\d{2})[/-])?"
                  r"(\d{1,2})[/-](\d{1,2})",
                  text
              )

              if m:
                  y1, m1, d1, y2, m2, d2 = m.groups()
                  y2 = y2 or y1

                  return (
                      f"{y1}-{int(m1):02d}-{int(d1):02d}",
                      f"{y2}-{int(m2):02d}-{int(d2):02d}"
                  )

              # 2026年9月11日から10月3日
              m = re.search(
                  r"(20\d{2})年(\d{1,2})月(\d{1,2})日"
                  r".{0,20}?"
                  r"(\d{1,2})月(\d{1,2})日",
                  text
              )

              if m:
                  y, m1, d1, m2, d2 = m.groups()

                  return (
                      f"{y}-{int(m1):02d}-{int(d1):02d}",
                      f"{y}-{int(m2):02d}-{int(d2):02d}"
                  )

              # 2026年9月6日
              m = re.search(
                  r"(20\d{2})年(\d{1,2})月(\d{1,2})日",
                  text
              )

              if m:
                  y, mo, d = m.groups()
                  date = f"{y}-{int(mo):02d}-{int(d):02d}"
                  return date, date

              # 2026/9/6
              date = normalize_date(text)

              if date:
                  return date, date

              return None, None

          # --------------------------------------------------
          # イベント詳細ページのリンクを探す
          # --------------------------------------------------

          def find_event_links(soup):
              links = []

              if not soup:
                  return links

              for a in soup.find_all("a", href=True):
                  href = a.get("href", "")

                  if re.search(r"/event/detail_\d+\.html", href):
                      url = urljoin(BASE_URL, href)

                      if url not in links:
                          links.append(url)

              return links

          # --------------------------------------------------
          # 次の一覧ページを探す
          # --------------------------------------------------

          def find_next_pages(soup, current_url):
              results = []

              if not soup:
                  return results

              current_host = urlparse(current_url).netloc

              for a in soup.find_all("a", href=True):
                  text = a.get_text(" ", strip=True)
                  href = a.get("href", "")

                  if not href:
                      continue

                  url = urljoin(BASE_URL, href)

                  if urlparse(url).netloc != current_host:
                      continue

                  if "/event/" not in url:
                      continue

                  # 詳細ページは除外
                  if re.search(r"/event/detail_\d+\.html", url):
                      continue

                  # ページ送りらしいリンク
                  if (
                      text in ["次へ", "次", ">", "»", "›", "Next"]
                      or text.isdigit()
                  ):
                      results.append(url)

              return results

          # --------------------------------------------------
          # 一覧ページを収集
          # --------------------------------------------------

          list_pages = [START_URL]
          checked_pages = set()

          while list_pages and len(checked_pages) < 20:

              url = list_pages.pop(0)

              if url in checked_pages:
                  continue

              checked_pages.add(url)

              print("一覧ページ:", url)

              soup = get_soup(url)

              if not soup:
                  continue

              for next_url in find_next_pages(soup, url):

                  if next_url not in checked_pages and next_url not in list_pages:
                      list_pages.append(next_url)

          print("一覧ページ数:", len(checked_pages))

          # --------------------------------------------------
          # 詳細ページURLを収集
          # --------------------------------------------------

          event_urls = set()

          for url in checked_pages:

              soup = get_soup(url)

              if not soup:
                  continue

              links = find_event_links(soup)

              print(url, "→", len(links), "件")

              for link in links:
                  event_urls.add(link)

          print("イベント詳細ページ数:", len(event_urls))

          # --------------------------------------------------
          # 詳細ページからイベント情報を取得
          # --------------------------------------------------

          fetched_events = []

          for i, url in enumerate(sorted(event_urls), 1):

              print(f"[{i}/{len(event_urls)}] {url}")

              soup = get_soup(url)

              if not soup:
                  continue

              # ページ全体のテキスト
              text = soup.get_text("\n", strip=True)

              # タイトル
              title = ""

              h1 = soup.find("h1")

              if h1:
                  title = h1.get_text(" ", strip=True)

              if not title:
                  title_tag = soup.find("title")

                  if title_tag:
                      title = title_tag.get_text(" ", strip=True)

              # 不要なサイト名を削除
              title = re.sub(
                  r"\s*[｜|]\s*イベント.*$",
                  "",
                  title
              ).strip()

              if not title:
                  continue

              # 開催期間
              start_date = None
              end_date = None

              # 「開催期間」の周辺テキストを探す
              body_text = text

              m = re.search(
                  r"開催期間\s*(.{0,500})",
                  body_text,
                  re.S
              )

              if m:
                  period_text = m.group(1)
              else:
                  period_text = body_text

              start_date, end_date = parse_dates(period_text)

              # 日付が取れない場合はスキップ
              if not start_date:
                  print("日付取得失敗:", title)
                  continue

              # 開催場所
              place = ""

              m = re.search(
                  r"開催場所\s*(.{0,300})",
                  body_text,
                  re.S
              )

              if m:
                  place = m.group(1).split("\n")[0].strip()

              if not place:
                  place = "北海道"

              # エリア・カテゴリー
              category = ""

              m = re.search(
                  r"カテゴリー\s*(.{0,300})",
                  body_text,
                  re.S
              )

              if m:
                  category = m.group(1).split("\n")[0].strip()

              # 種類を推定
              event_type = "イベント"

              if "花火" in title or "花火" in category:
                  event_type = "花火"
              elif "マラソン" in title or "ラン" in title:
                  event_type = "スポーツ"
              elif any(x in title for x in ["祭", "まつり", "フェス"]):
                  event_type = "祭り"
              elif "イルミ" in title or "ライト" in title:
                  event_type = "イルミネーション"
              elif "グルメ" in category or "フード" in category:
                  event_type = "グルメ"
              elif "音楽" in category or "アート" in category:
                  event_type = "音楽・文化"
              elif "スポーツ" in category:
                  event_type = "スポーツ"

              # ホテル・交通への影響を簡易判定
              hotel = "低"
              traffic = "低"
              crowd = "普通"

              high_words = [
                  "札幌",
                  "帯広",
                  "小樽",
                  "函館",
                  "旭川",
                  "千歳",
                  "ドーム",
                  "花火",
                  "マラソン",
                  "フェス",
                  "航空祭",
                  "オータムフェスト"
              ]

              medium_words = [
                  "祭",
                  "まつり",
                  "食べマルシェ",
                  "マルシェ"
              ]

              if any(word in title for word in high_words):
                  hotel = "高"
                  traffic = "高"
                  crowd = "多"

              elif any(word in title for word in medium_words):
                  hotel = "中"
                  traffic = "中"
                  crowd = "普通"

              fetched_events.append({
                  "date": start_date,
                  "endDate": end_date or start_date,
                  "name": title,
                  "place": place,
                  "type": event_type,
                  "hotel": hotel,
                  "traffic": traffic,
                  "crowd": crowd,
                  "description": f"HOKKAIDO LOVE!掲載イベント（{category}）",
                  "sourceUrl": url
              })

          # --------------------------------------------------
          # 既存events.jsonを読み込み
          # --------------------------------------------------

          try:
              with open("events.json", "r", encoding="utf-8") as f:
                  existing = json.load(f)
          except Exception:
              existing = []

          if not isinstance(existing, list):
              existing = []

          # --------------------------------------------------
          # 既存データを残しつつ自動取得データを追加
          # --------------------------------------------------

          merged = []

          seen = set()

          for event in existing + fetched_events:

              name = str(event.get("name", "")).strip()
              date = str(event.get("date", "")).strip()

              if not name or not date:
                  continue

              key = (name, date)

              if key in seen:
                  continue

              seen.add(key)
              merged.append(event)

          # 日付順
          merged.sort(
              key=lambda x: (
                  x.get("date", "9999-99-99"),
                  x.get("name", "")
              )
          )

          # --------------------------------------------------
          # 安全チェック
          # --------------------------------------------------

          print("既存イベント:", len(existing))
          print("自動取得イベント:", len(fetched_events))
          print("最終イベント:", len(merged))

          if len(fetched_events) == 0:
              print("ERROR: 自動取得イベントが0件です")
              raise SystemExit(1)

          # --------------------------------------------------
          # JSON保存
          # --------------------------------------------------

          with open("events.json", "w", encoding="utf-8") as f:
              json.dump(
                  merged,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("events.json 更新完了")

          PY

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: 北海道イベント情報"
            git push
          fi
