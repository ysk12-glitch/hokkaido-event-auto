name: 北海道イベント自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要なライブラリをインストール
        run: |
          pip install requests beautifulsoup4

      - name: 北海道イベント情報を取得
        run: |
          python <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import json
          import re
          from urllib.parse import urljoin
          import time

          BASE_URL = "https://www.visit-hokkaido.jp"
          START_URL = "https://www.visit-hokkaido.jp/event/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              )
          }

          session = requests.Session()
          session.headers.update(headers)

          # ==========================================
          # ページ取得
          # ==========================================

          def get_soup(url):
              try:
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  return BeautifulSoup(r.text, "html.parser")
              except Exception as e:
                  print("取得失敗:", url)
                  print(e)
                  return None

          # ==========================================
          # ページ内のテキストを行単位で取得
          # ==========================================

          def get_lines(soup):
              return [
                  x.strip()
                  for x in soup.stripped_strings
                  if x.strip()
              ]

          # ==========================================
          # 「開催期間」「開催場所」の直後の文字を取得
          # ==========================================

          def get_value_after_label(lines, label):
              for i, line in enumerate(lines):
                  if line.strip() == label:
                      for j in range(i + 1, min(i + 5, len(lines))):
                          value = lines[j].strip()

                          if value and value != label:
                              return value

              return ""

          # ==========================================
          # 日付を正規化
          # ==========================================

          def make_date(year, month, day):
              return f"{int(year):04d}-{int(month):02d}-{int(day):02d}"

          # ==========================================
          # 開催期間を解析
          # ==========================================

          def parse_period(text):

              if not text:
                  return None, None

              text = text.strip()

              # 例:
              # 2026/9/4-9/6
              m = re.search(
                  r"^(20\d{2})/(\d{1,2})/(\d{1,2})"
                  r"\s*[-〜～]\s*"
                  r"(?:(20\d{2})/)?(\d{1,2})/(\d{1,2})",
                  text
              )

              if m:
                  y1, m1, d1, y2, m2, d2 = m.groups()

                  y2 = y2 or y1

                  return (
                      make_date(y1, m1, d1),
                      make_date(y2, m2, d2)
                  )

              # 例:
              # 2026年9月11日から10月3日
              m = re.search(
                  r"^(20\d{2})年(\d{1,2})月(\d{1,2})日"
                  r"\s*(?:から|-|〜|～)"
                  r"\s*(?:(20\d{2})年)?(\d{1,2})月(\d{1,2})日",
                  text
              )

              if m:
                  y1, m1, d1, y2, m2, d2 = m.groups()

                  y2 = y2 or y1

                  return (
                      make_date(y1, m1, d1),
                      make_date(y2, m2, d2)
                  )

              # 例:
              # 2026年9月6日
              m = re.search(
                  r"^(20\d{2})年(\d{1,2})月(\d{1,2})日",
                  text
              )

              if m:
                  y, mo, d = m.groups()

                  date = make_date(y, mo, d)

                  return date, date

              # 例:
              # 2026/9/6
              m = re.search(
                  r"^(20\d{2})/(\d{1,2})/(\d{1,2})",
                  text
              )

              if m:
                  y, mo, d = m.groups()

                  date = make_date(y, mo, d)

                  return date, date

              return None, None

          # ==========================================
          # イベント詳細URLを探す
          # ==========================================

          def find_event_links(soup):

              result = set()

              for a in soup.find_all("a", href=True):

                  href = a["href"]

                  if re.search(
                      r"/event/detail_\d+\.html",
                      href
                  ):
                      result.add(
                          urljoin(BASE_URL, href)
                      )

              return result

          # ==========================================
          # 一覧ページを取得
          # ==========================================

          list_urls = [START_URL]
          checked = set()

          while list_urls and len(checked) < 20:

              url = list_urls.pop(0)

              if url in checked:
                  continue

              checked.add(url)

              print("一覧ページ:", url)

              soup = get_soup(url)

              if not soup:
                  continue

              # イベント詳細ページ
              # 自体は後でまとめて取得

              # ページ送りを探す
              for a in soup.find_all("a", href=True):

                  text = a.get_text(
                      " ",
                      strip=True
                  )

                  href = a["href"]

                  next_url = urljoin(
                      BASE_URL,
                      href
                  )

                  # 詳細ページは除外
                  if re.search(
                      r"/event/detail_\d+\.html",
                      next_url
                  ):
                      continue

                  # イベント一覧ページのみ
                  if "/event/" not in next_url:
                      continue

                  # 数字ページ、次へ
                  if (
                      text.isdigit()
                      or text in [
                          "次へ",
                          "次",
                          ">",
                          "»",
                          "›",
                          "Next"
                      ]
                  ):
                      if next_url not in checked:
                          if next_url not in list_urls:
                              list_urls.append(
                                  next_url
                              )

          print(
              "一覧ページ取得数:",
              len(checked)
          )

          # ==========================================
          # 詳細ページURLを全部集める
          # ==========================================

          event_urls = set()

          for url in checked:

              soup = get_soup(url)

              if not soup:
                  continue

              urls = find_event_links(soup)

              event_urls.update(urls)

          print(
              "イベント詳細ページ数:",
              len(event_urls)
          )

          # ==========================================
          # 詳細ページからイベント情報取得
          # ==========================================

          fetched = []

          for count, url in enumerate(
              sorted(event_urls),
              1
          ):

              print(
                  f"[{count}/{len(event_urls)}]",
                  url
              )

              soup = get_soup(url)

              if not soup:
                  continue

              lines = get_lines(soup)

              # --------------------------------------
              # イベント名
              # --------------------------------------

              name = ""

              h1 = soup.find("h1")

              if h1:
                  name = h1.get_text(
                      " ",
                      strip=True
                  )

              if not name:
                  print("名前取得失敗")
                  continue

              # サイト名そのものは除外
              if name in [
                  "北海道観光公式サイト HOKKAIDO LOVE!",
                  "HOKKAIDO LOVE!"
              ]:
                  print(
                      "イベント名ではないため除外:",
                      name
                  )
                  continue

              # --------------------------------------
              # 開催期間
              # --------------------------------------

              period = get_value_after_label(
                  lines,
                  "開催期間"
              )

              start_date, end_date = parse_period(
                  period
              )

              if not start_date:

                  print(
                      "開催期間取得失敗:",
                      name,
                      period
                  )

                  continue

              # --------------------------------------
              # 開催場所
              # --------------------------------------

              place = get_value_after_label(
                  lines,
                  "開催場所"
              )

              if not place:
                  place = "北海道"

              # --------------------------------------
              # カテゴリー
              # --------------------------------------

              category = get_value_after_label(
                  lines,
                  "カテゴリー"
              )

              # --------------------------------------
              # イベント種類
              # --------------------------------------

              event_type = "イベント"

              if "花火" in name:
                  event_type = "花火"

              elif (
                  "マラソン" in name
                  or "駅伝" in name
                  or "ウルトラ" in name
                  or "スポーツ" in category
              ):
                  event_type = "スポーツ"

              elif (
                  "祭" in name
                  or "まつり" in name
                  or "フェス" in name
              ):
                  event_type = "祭り"

              elif (
                  "イルミ" in name
                  or "ライトアップ" in name
              ):
                  event_type = "イルミネーション"

              elif (
                  "グルメ" in category
                  or "フード" in category
              ):
                  event_type = "グルメ"

              elif (
                  "音楽" in category
                  or "アート" in category
              ):
                  event_type = "音楽・文化"

              # --------------------------------------
              # 影響度
              # --------------------------------------

              hotel = "低"
              traffic = "低"
              crowd = "普通"

              high_keywords = [
                  "オータムフェスト",
                  "花火",
                  "マラソン",
                  "航空祭",
                  "ドーム",
                  "フェス",
                  "YOSAKOI",
                  "勝毎",
                  "食べマルシェ"
              ]

              medium_keywords = [
                  "祭",
                  "まつり",
                  "マルシェ",
                  "フェスタ"
              ]

              if any(
                  word in name
                  for word in high_keywords
              ):
                  hotel = "高"
                  traffic = "高"
                  crowd = "多"

              elif any(
                  word in name
                  for word in medium_keywords
              ):
                  hotel = "中"
                  traffic = "中"
                  crowd = "普通"

              # --------------------------------------
              # 保存
              # --------------------------------------

              fetched.append({
                  "date": start_date,
                  "endDate": end_date or start_date,
                  "name": name,
                  "place": place,
                  "type": event_type,
                  "hotel": hotel,
                  "traffic": traffic,
                  "crowd": crowd,
                  "description": (
                      "HOKKAIDO LOVE!掲載イベント"
                      + (
                          f"（{category}）"
                          if category
                          else ""
                      )
                  ),
                  "sourceUrl": url
              })

              # サーバー負荷軽減
              time.sleep(0.1)

          # ==========================================
          # 既存events.json
          # ==========================================

          try:

              with open(
                  "events.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  existing = json.load(f)

          except Exception:

              existing = []

          if not isinstance(existing, list):
              existing = []

          # ==========================================
          # 古い自動取得データを削除
          #
          # 手作業で登録したライブ・マラソン等は残す
          # ==========================================

          manual_events = []

          for event in existing:

              source = str(
                  event.get(
                      "sourceUrl",
                      ""
                  )
              )

              # HOKKAIDO LOVE!から以前取得した
              # 壊れたデータは削除
              if "visit-hokkaido.jp" in source:
                  continue

              manual_events.append(event)

          # ==========================================
          # 手動データ + 新しい自動取得
          # ==========================================

          merged = []

          seen = set()

          for event in (
              manual_events + fetched
          ):

              name = str(
                  event.get(
                      "name",
                      ""
                  )
              ).strip()

              date = str(
                  event.get(
                      "date",
                      ""
                  )
              ).strip()

              if not name or not date:
                  continue

              # 明らかにおかしいデータを除外
              if (
                  "HOKKAIDO LOVE!" in name
                  or "北海道観光公式サイト" in name
              ):
                  continue

              if not re.match(
                  r"^20\d{2}-\d{2}-\d{2}$",
                  date
              ):
                  continue

              key = (
                  name,
                  date
              )

              if key in seen:
                  continue

              seen.add(key)

              merged.append(event)

          # ==========================================
          # 日付順
          # ==========================================

          merged.sort(
              key=lambda x: (
                  x.get(
                      "date",
                      "9999-99-99"
                  ),
                  x.get(
                      "name",
                      ""
                  )
              )
          )

          # ==========================================
          # 安全チェック
          # ==========================================

          print(
              "手動データ:",
              len(manual_events)
          )

          print(
              "新規取得:",
              len(fetched)
          )

          print(
              "最終件数:",
              len(merged)
          )

          # 自動取得が0件なら更新しない
          if len(fetched) == 0:

              print(
                  "ERROR: イベントを1件も取得できませんでした"
              )

              raise SystemExit(1)

          # ==========================================
          # 保存
          # ==========================================

          with open(
              "events.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  merged,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "events.json 更新完了"
          )

          PY

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: 北海道イベント情報"
            git push
          fi
